schema: spec-driven

rules:
  proposal:
    - Write the entire proposal and all subsequent updates in English. Preserve proper names, identifiers, and literal content-matching expressions in their original form.
    - Keep proposals under 500 words
    - Always state what is out of scope
  tasks:
    - Write the entire task list and all subsequent updates in English. Preserve proper names, identifiers, and literal content-matching expressions in their original form.
    - Break tasks into chunks of max 2 hours
    - Every proposal must include tasks for 1) `ruff check` and deal with the problems found; 2) `ruff format`; 3) run the full test suite, which should fix errors even if they are not from this change (but the operator needs to confirm the non-change related fixes).
  design:
    - Write the entire design and all subsequent updates in English. Preserve proper names, identifiers, and literal content-matching expressions in their original form.
  specs:
    - Write all specifications, scenarios, and subsequent updates in English. Preserve proper names, identifiers, and literal content-matching expressions in their original form.

context: |
  Write all OpenSpec artifacts and all future additions or updates to them in
  English, including proposals, designs, specifications, scenarios, and task lists.
  Preserve proper names, identifiers, and literal content-matching expressions in
  their original form. This language rule does not change the language of site
  content or the tool's user-facing help and usage documentation.

  Sin Dioses is a Spanish-language static website generated with Nikola, not a
  server application. Plan changes around source content, local plugins, themes,
  and standalone maintenance scripts rather than introducing an application stack.

  Keep editorial content in Spanish unless working on an existing translation.
  Preserve UTF-8 accents, attribution, source links, publication metadata, and
  license notices. This editorial requirement is separate from the English-only
  OpenSpec artifact rule. Preserve published URLs and filename case, and retain inbound
  links through redirects when moving pages. Keep the static entrance page and
  its link to principal.html; do not replace it with an automatic blog index.
  Preserve category spelling, document references, shared includes, and metadata
  that controls templates, article types, or comments. Avoid unrelated migrations.

  Prefer site-specific theme changes under themes/sindioses/. Change its parent,
  themes/bootstrap3/, only for shared parent behavior. Preserve template inheritance
  and context contracts, public asset paths, and bundled licenses. Account for
  collisions between files/ and images/, which both publish to the output root.

  Use uv for Python tooling and dependency changes; update pyproject.toml and
  uv.lock together when changing project dependencies. Standalone scripts with
  PEP 723 metadata must run with uv run --script to resolve their own dependencies.
  Do not assume legacy utilities have all dependencies installed or are read-only:
  several rewrite content or update databases. Metadata migrations require an
  explicit migration scope and are not validation commands.

  For Python design, implementation, refactoring, and tests, read and follow
  the python-implementation-expert skill.
  Use python-prototyping-expert instead only when the user explicitly requests
  a prototype, spike, demo, or throwaway experiment. Do not apply both.

  Test methodology requires a mandatory minimum of 85% aggregate line coverage,
  with a desired goal of at least 90%. Reach these levels through meaningful
  tests of project-owned behavior, not tests of standard-library or third-party
  functionality. Apply python-implementation-expert to the entire Python test
  suite, including fixtures and doubles.
  Do not artificially inflate coverage by excluding code or narrowing the measured
  source scope. Exclusions are permitted only when testing the code is completely
  impractical. Every exclusion requires explicit operator confirmation before it
  is applied; record its exact scope, justification, and operator decision.
  Test-suite maintenance must not change production code, including formatting,
  refactoring, or adding test seams. If an indispensable production defect is
  demonstrated, obtain express operator authorization for the specific correction
  before editing source code. Existing failures or coverage goals do not authorize
  application changes, weakened assertions, or concealed failures.

  Edit sources, not generated output or caches, and preserve unrelated working-tree
  changes. Exclude local environments, IDE state, caches, and temporary data from
  changes and published assets.

  For website content, configuration, plugin, or template changes, build from the
  repository root and inspect affected generated pages. For shared theme changes,
  inspect principal.html, a section index, an article, and the gallery at desktop
  and narrow widths. Check image paths after asset changes. The image checker is
  a manual report, not a failing CI gate, and a successful build does not validate
  links or external services. Run the owned Python suite with just test or
  uv run pytest. Bundled Reveal tests do not validate the site. Run Ruff on test
  files during test-suite maintenance; do not format or change production code
  without express operator authorization.

  Deploy only when publication is explicitly requested. Review the working tree
  first: Nikola's GitHub deployment can commit source changes as well as push the
  generated site. Keep OpenSpec proposals, designs, tasks, and specifications
  consistent; ordinary maintenance does not require a new OpenSpec change.



# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
operations:
 apply:
   guidance:
     - Keep test summaries concise
 archive:
   guidance:
     - Summarize the archive outcome before finishing
     - Save all new specs, and merge all updated specs, without asking for confirmation but summarizing the operations.
