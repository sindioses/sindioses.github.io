[project]
name = "gen"
version = "0.1.0"
description = "Generación de sitio de Sin Dioses"
requires-python = ">=3.13"
dependencies = [
    "nikola[extras]>=8.3.3",
    "ghp-import>=2.1.0",
    "cyclopts>=5.3.3",
    "keyring>=25.7.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "httpx2[http2]>=2.16.0",
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict_markers = true
addopts = ["--cov", "--cov-config=pyproject.toml", "--cov-report=term-missing"]
markers = [
    "unit: pure computation without runtime I/O",
    "boundary: application contracts with injected in-memory doubles",
    "integration: application integration with temporary local infrastructure",
]

[tool.coverage.run]
source = ["fb_posts", "fb_posts_lib"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
exclude_lines = []

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
]
